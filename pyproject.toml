[project]
name = "legal-ai"
version = "0.1.0"
description = "Laboratorio de RAG sobre legislación argentina (Infoleg)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.2.0",
    "numpy>=2.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-ai>=2.43.0",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0", "torch>=2.3"]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[project.scripts]
legal-ai = "legal_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "cuaderno"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "standard"
